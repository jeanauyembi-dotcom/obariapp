R['wallet']=m=>{if(m[1]=='history'){const g=F.wg||'all',L=S.txs.filter(t=>g=='all'||(g=='cr'?t.a>0:t.a<0));return hd('Historique du Wallet')+`<div class="tabs">${[['all','Tout'],['cr','Recharges'],['db','Paiements']].map(([k,l])=>`<button class="${g==k?'on':''}" data-a="wg" data-g="${k}">${l}</button>`).join('')}</div><div class="pg">${L.length?L.map(t=>`<div class="card" style="margin-bottom:8px;display:flex;justify-content:space-between;align-items:center"><div><b>${t.a>0?'Recharge':'Paiement'}</b><div class="muted sm">${dt(t.d)}${t.s=='ok'?'':' · En attente'}</div></div><b style="color:${t.a>0?'var(--ac)':'inherit'}">${t.a>0?'+':'−'} ${fmt(Math.abs(t.a))}</b></div>`).join(''):empty('wallet','Aucune opération','Vos recharges et paiements apparaîtront ici.','Recharger mon Wallet','/wallet/topup')}</div>`}
 const s=T.s||'op',body={op:`<h2 style="font-size:18px">Choisissez votre opérateur</h2><p class="muted" style="margin:4px 0 14px">Votre Wallet sera crédité dès la validation du paiement.</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">${[['airtel','Airtel Money','airtel_money'],['moov','Moov Money','moov_money']].map(([k,l,i])=>`<button class="tile ${T.op==k?'on':''}" style="flex-direction:column;padding:10px;margin:0" data-a="top" data-o="${k}"><img class="opx" src="${IMG[i]}" alt="${l}"><b>${l}</b></button>`).join('')}</div><button class="btn" style="margin-top:20px" data-a="tn" data-s="am" ${T.op?'':'disabled'}>Continuer</button>`,
 am:`<h2 style="font-size:18px">Quel montant ?</h2><div class="qa">${D.quick.map(a=>`<button class="${T.amt==a?'on':''}" data-a="qa" data-v="${a}">${num(a)}</button>`).join('')}</div><label class="fl">Ou saisissez un montant (FCFA)</label><input class="in" data-f="t.amt" data-t="1" inputmode="numeric" placeholder="Ex. 5000" value="${T.amt||''}"><p id="er" class="sm b" style="color:var(--brown);margin-top:8px"></p><button class="btn" style="margin-top:14px" data-a="tamt">Continuer</button>`,
 ph:`<h2 style="font-size:18px">Numéro ${T.op=='airtel'?'Airtel Money':'Moov Money'}</h2><label class="fl">Numéro de téléphone</label><div class="ph"><span>+241</span><input class="in" data-f="t.ph" data-t="1" inputmode="tel" placeholder="${T.op=='airtel'?'074':'060'} 12 34 56" value="${T.ph||''}"></div><button class="btn" style="margin-top:20px" data-a="tn" data-s="cf">Continuer</button>`,
 cf:`<h2 style="font-size:18px">Confirmez votre recharge</h2><div class="card" style="margin:14px 0"><div class="tr"><span class="muted">Montant</span><b>${fmt(T.amt)}</b></div><div class="tr"><span class="muted">Numéro</span><b>+241 ${T.ph}</b></div></div><p class="muted sm">Vous allez recevoir une demande de validation (USSD) sur ce téléphone. Gardez-le à portée de main.</p><button class="btn" style="margin-top:16px" data-a="pay2">Confirmer et payer</button>`,
 wt:`<div class="empty"><h2>Validez le paiement sur votre téléphone</h2><p>Une demande de ${fmt(T.amt)} a été envoyée au +241 ${T.ph}. Saisissez votre code secret pour confirmer.</p><b class="ac">Validation en cours…</b></div>`,
 ok:`<div style="text-align:center"><div class="ok">${ic('check',44)}</div><h1 style="font-size:22px">Recharge réussie !</h1><div class="ac b" style="font-size:28px;margin:10px 0">+ ${fmt(T.amt)}</div><p class="muted">Nouveau solde : ${fmt(S.bal)}</p><button class="btn" style="margin-top:20px" data-go="${T.fc?'/checkout/summary':'/'}">${T.fc?'Retour à ma commande':'Terminer'}</button></div>`}[s];return hd('Recharger mon Wallet')+`<div class="pg">${body}</div>`};
R['addresses']=m=>{if(m[1]=='edit'){const a=F.ea||(F.ea={label:'Domicile',commune:'',quartier:'',phone:S.user.phone,note:''});return hd(a.id?"Modifier l'adresse":'Nouvelle adresse')+`<div class="pg"><label class="fl">Nom de l'adresse</label><input class="in" data-f="ea.label" placeholder="Domicile, Bureau…" value="${a.label||''}">${addrForm(a,'ea')}<label class="fl" style="display:flex;gap:10px;align-items:center"><input type="checkbox" data-f="ea.def" ${a.def?'checked':''}> Définir comme adresse par défaut</label><button class="btn" style="margin-top:18px" data-a="saveaddr">Enregistrer</button></div>`}
 return hd('Mes adresses')+`<div class="pg">${S.addrs.length?S.addrs.map(a=>`<div class="card" style="margin-bottom:10px"><div style="display:flex;justify-content:space-between"><b>${a.label}</b>${a.def?'<span class="badge">Par défaut</span>':''}</div><div class="muted">${a.quartier}, ${a.commune}</div><div class="muted sm">Tél. ${a.phone}</div><div style="display:flex;gap:6px;margin-top:6px">${a.def?'':`<button class="btn lk" style="width:auto" data-a="defaddr" data-id="${a.id}">Définir par défaut</button>`}<button class="btn lk" style="width:auto" data-a="editaddr" data-id="${a.id}">Modifier</button><button class="btn lk" style="width:auto;color:var(--brown)" data-a="deladdr" data-id="${a.id}">Supprimer</button></div></div>`).join(''):empty('pin','Aucune adresse enregistrée','Ajoutez vos adresses de livraison pour commander plus vite.')}<button class="btn" data-a="newaddr">Ajouter une adresse</button></div>`};
R['notifications']=()=>{S.notifs.forEach(n=>n.r=1);return hd('Notifications')+`<div class="pg">${S.notifs.length?S.notifs.map(n=>`<div class="card" style="margin-bottom:8px"><b>${n.t}</b><div class="muted">${n.m}</div><div class="muted sm">${dt(n.d)}</div></div>`).join(''):empty('bell','Aucune notification','Le suivi de vos commandes et recharges apparaîtra ici.')}</div>`};
R['settings']=()=>{const sw=(k,t,s)=>`<button class="li" data-a="sw" data-k="${k}"><div><b>${t}</b><div class="sub">${s}</div></div><span class="sw ${S[k]?'on':''}"></span></button>`;return hd('Paramètres')+`<div class="lst" style="margin-top:6px"><div class="li" style="cursor:default"><div><b>Thème</b></div></div><div style="padding:0 16px 14px"><div class="seg">${[['light','Clair'],['dark','Sombre'],['auto','Automatique']].map(([k,l])=>`<button class="${S.theme==k?'on':''}" data-a="th" data-k="${k}">${l}</button>`).join('')}</div></div></div><div class="lst">${sw('nt','Notifications','Statut de vos commandes et recharges')}${sw('vib','Vibrations','Retours haptiques à chaque action')}<div class="li" style="cursor:default"><div><b>Langue</b><div class="sub">Français · English bientôt disponible</div></div></div></div><p class="muted sm" style="text-align:center">OBARI • Version 1.0.0</p>`};
R['contact']=()=>hd('Nous contacter')+`<div class="pg"><p class="muted" style="margin-bottom:14px">Une question, un souci avec une commande ? Notre équipe vous répond.</p><div class="lst" style="margin:0">${[['chat','WhatsApp','Discutez avec nous'],['phone','Appeler','+241 00 00 00 00'],['mail','E-mail','support@obari.ga']].map(([i,t,s])=>`<button class="li" data-a="soon">${ic(i,22)}<div><b>${t}</b><div class="sub">${s}</div></div>${ic('next',18)}</button>`).join('')}</div></div>`;
R['about']=()=>hd('À propos / CGU')+`<div class="pg"><img src="${IMG.logo_text}" style="width:130px;display:block;margin:0 auto 14px"><p class="mono">${D.legal.about}</p><h2 style="margin:20px 0 8px;font-size:15px">Conditions générales</h2><p class="mono muted">${D.legal.terms}</p></div>`;
const TABS=[['','logo','Obari'],['cart','panier','Panier'],['deliveries','livraison','Livraisons'],['me','moi','Moi']];
$('#nav').innerHTML=`<div class="gp"><i class="dr"></i>${TABS.map((t,i)=>`<button data-go="/${t[0]}">${mi(t[1])}<span>${t[2]}</span><em class="cb" id="cb${i}" style="display:none"></em></button>`).join('')}</div><button class="sc" data-go="/search" aria-label="Rechercher">${ic('search',26)}</button>`;
function navUpd(i){const n=cnt(),b=$('#cb1');if(b){b.textContent=n;b.style.display=n?'grid':'none'}if(i>=0&&i!=null){$('.dr').style.transform=`translateX(${i*100}%)`;document.querySelectorAll('.gp button').forEach((x,j)=>x.classList.toggle('on',j==i))}}
function theme(){app.dataset.t=S.theme=='auto'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):S.theme}
function render(){let h=location.hash.slice(1)||'/splash';const[p,q]=h.split('?'),Q=new URLSearchParams(q||''),m=p.split('/').filter(Boolean),k=m[0]||'';
 if(k!='splash'&&!S.region&&k!='region')return rep('/splash');
 if(/^(checkout|wallet|addresses|notifications)$/.test(k)&&!S.user)return rep('/auth?redirect='+encodeURIComponent(h));
 if(k=='wallet'&&m[1]=='topup'){T.fc=Q.get('from')=='checkout';if(T.s=='ok'||T.s=='wt')T={fc:T.fc}}
 if(k=='auth'&&S.user)return rep(Q.get('redirect')||'/');
 const f=R[k]||(()=>empty('info','Page introuvable','Cette page n\'existe pas.','Retour à l\'accueil','/'));const html=f(m,Q);if(html===undefined)return;
 const ti=TABS.findIndex(t=>t[0]==k&&!m[1]);scr.className=ti>=0?'tab':'';scr.innerHTML=html;scr.style.animation='none';scr.offsetHeight;scr.style.animation='';scr.scrollTop=0;
 $('#nav').style.display=ti>=0?'flex':'none';navUpd(ti);const si=$('#si');if(si)si.focus()}
function setF(path,v){const[a,b]=path.split('.');if(b){(a=='t'?T:F[a]=F[a]||{})[b]=v;if(a=='t')T[b]=v}else F[a]=v}
const rerender=()=>{const y=scr.scrollTop;render();scr.scrollTop=y};
document.addEventListener('input',e=>{const t=e.target,f=t.dataset.f;if(!f)return;if(t.dataset.t){T[f.split('.')[1]]=t.value;return}
 if(t.type=='checkbox')return setF(f,t.checked?1:0);setF(f,t.value);if(t.dataset.live){const q=t.value.trim().toLowerCase();$('#sr').innerHTML=srHtml(q,q?D.products.filter(p=>(p.name+p.description+catOf(p.category).title).toLowerCase().includes(q)):[],q?D.combos.filter(c=>(c.name+c.description).toLowerCase().includes(q)):[])}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.f&&t.tagName=='SELECT'){setF(t.dataset.f,t.value);if(t.dataset.re){const[a]=t.dataset.f.split('.');F[a].quartier='';rerender()}}});
const er=m=>{const e=$('#er');if(e)e.textContent=m;return 0};
const okPh=p=>/^0\d{8}$/.test((p||'').replace(/\s/g,''));
document.addEventListener('click',e=>{const a=e.target.closest('[data-a]');
 if(!a){if(e.target.closest('[data-back]'))return back();const g=e.target.closest('[data-go]');if(g)go(g.dataset.go);return}
 e.stopPropagation();const d=a.dataset,x=d.a;
 const by=k=>S.cart.find(i=>i.key==k);
 if(x=='reg'){F.reg=d.id;rerender()}
 else if(x=='start'){S.region=1;rep('/')}
 else if(x=='add'){e.preventDefault();addCart('p',d.id);toast(P(d.id).name+' ajouté au panier','Voir','/cart')}
 else if(x=='addq'){addCart('p',d.id,F.q);toast(P(d.id).name+' ajouté au panier','Voir','/cart')}
 else if(x=='addc'){addCart('c',d.id);toast(C(d.id).name+' ajouté au panier','Voir','/cart')}
 else if(x=='addcq'){addCart('c',d.id,F.q);toast(C(d.id).name+' ajouté au panier','Voir','/cart')}
 else if(x=='inc'||x=='dec'){const s=x=='inc'?1:-1;if(d.k=='pq'){F.q=Math.max(1,F.q+s)}else{const i=by(d.k);i.q=Math.max(1,i.q+s)}rerender();navUpd()}
 else if(x=='tog'){by(d.k).sel^=1;rerender()}
 else if(x=='all'){const v=!S.cart.every(i=>i.sel);S.cart.forEach(i=>i.sel=v?1:0);rerender()}
 else if(x=='del'){const i=by(d.k);S.cart=S.cart.filter(z=>z!=i);rerender();navUpd();toast(i.name+' retiré','Annuler','/cart');$('#toast b').onclick=()=>{S.cart.push(i);rerender();navUpd();$('#toast').style.display='none'}}
 else if(x=='order'){F.a=null;go(S.user?'/checkout/delivery':'/auth?redirect='+encodeURIComponent('/checkout/delivery'))}
 else if(x=='am'){F.am=d.m;rerender()}
 else if(x=='dologin'){if(!okPh(F.ph))return er('Numéro invalide (9 chiffres, ex. 077 12 34 56).');if((F.pw||'').length<6)return er('Mot de passe : 6 caractères minimum.');login({fn:'Aurore',ln:'Moussavou',phone:F.ph});rep(F.red)}
 else if(x=='dosign'){if(!F.fn||!F.ln)return er('Renseignez votre prénom et votre nom.');if(!okPh(F.ph))return er('Numéro invalide (9 chiffres, ex. 077 12 34 56).');if((F.pw||'').length<6)return er('Mot de passe : 6 caractères minimum.');if(F.pw!=F.pw2)return er('Les mots de passe ne correspondent pas');F.am='otp';rerender()}
 else if(x=='otp'){if(!/^\d{6}$/.test(F.code||''))return toast('Entrez le code à 6 chiffres.');login({fn:F.fn,ln:F.ln,phone:F.ph});S.orders=[];S.notifs=[];S.txs=[];S.bal=0;F.am='login';rep(F.red)}
 else if(x=='pick'){F.a=Object.assign({},S.addrs.find(z=>z.id==d.id));rerender()}
 else if(x=='tosum'){const z=F.a;if(!z.commune||!z.quartier)return toast('Choisissez la commune et le quartier.');if(!okPh(z.phone))return toast('Numéro de téléphone invalide.');go('/checkout/summary')}
 else if(x=='pay'){S.pay=d.p;rerender()}
 else if(x=='place'){const sel=S.cart.filter(i=>i.sel),o=mkOrder(sel.map(i=>({name:i.name,price:i.price,q:i.q})),'cf',F.a,S.pay,0);if(S.pay=='wallet'){if(S.bal<o.total)return;S.bal-=o.total;S.txs.unshift({a:-o.total,s:'ok',d:new Date()})}S.orders.unshift(o);S.cart=S.cart.filter(i=>!i.sel);S.notifs.unshift({t:'Commande confirmée',m:'Commande '+o.no+' enregistrée.',r:0,d:new Date()});F.last=o;F.a=null;rep('/checkout/confirmation')}
 else if(x=='dg'){F.dg=d.g;rerender()}else if(x=='wg'){F.wg=d.g;rerender()}
 else if(x=='top'){T.op=d.o;rerender()}else if(x=='qa'){T.amt=d.v;rerender()}
 else if(x=='tn'){if(d.s=='cf'&&!(T.op=='airtel'?/^0(74|77|76)/:/^0(60|62|66)/).test((T.ph||'').replace(/\s/g,''))||d.s=='cf'&&!okPh(T.ph))return toast('Numéro '+(T.op=='airtel'?'Airtel (074, 076, 077)':'Moov (060, 062, 066)')+' invalide.');T.s=d.s;rerender()}
 else if(x=='tamt'){const v=+T.amt;if(!v)return er('Entrez un montant');if(v<D.tmin)return er('Minimum '+fmt(D.tmin));if(v>D.tmax)return er('Maximum '+fmt(D.tmax));T.amt=v;T.s='ph';rerender()}
 else if(x=='pay2'){T.s='wt';rerender();setTimeout(()=>{if(T.s!='wt')return;S.bal+=T.amt;S.txs.unshift({a:T.amt,s:'ok',d:new Date()});S.notifs.unshift({t:'Recharge réussie',m:'+ '+fmt(T.amt)+' ajoutés à votre Wallet.',r:0,d:new Date()});T.s='ok';if(location.hash.includes('topup'))rerender()},3000)}
 else if(x=='hide'){S.hide^=1;rerender()}
 else if(x=='logout'){if(confirm('Se déconnecter ?\nVotre panier est conservé sur cet appareil.')){S.user=null;S.orders=[];S.txs=[];S.notifs=[];S.addrs=[];S.bal=0;F={};T={};rerender();toast('Vous êtes déconnecté.')}}
 else if(x=='newaddr'){F.ea=null;go('/addresses/edit')}
 else if(x=='editaddr'){F.ea=Object.assign({},S.addrs.find(z=>z.id==d.id));go('/addresses/edit')}
 else if(x=='defaddr'){S.addrs.forEach(z=>z.def=z.id==d.id?1:0);rerender()}
 else if(x=='deladdr'){if(confirm('Supprimer cette adresse ?')){S.addrs=S.addrs.filter(z=>z.id!=d.id);rerender();toast('Adresse supprimée.')}}
 else if(x=='saveaddr'){const z=F.ea;if(!z.label||!z.commune||!z.quartier)return toast('Complétez le nom, la commune et le quartier.');if(!okPh(z.phone))return toast('Numéro de téléphone invalide.');if(z.id)Object.assign(S.addrs.find(y=>y.id==z.id),z);else{z.id='a'+Date.now();S.addrs.push(z)}if(z.def||S.addrs.length==1){S.addrs.forEach(y=>y.def=y.id==z.id?1:0)}F.ea=null;history.back();toast(z.id?'Adresse enregistrée.':'Adresse ajoutée.')}
 else if(x=='sw'){S[d.k]^=1;rerender()}else if(x=='th'){S.theme=d.k;theme();rerender()}
 else if(x=='soon')toast('Démo : coordonnées de contact à configurer.')});
addEventListener('hashchange',render);addEventListener('popstate',render);matchMedia('(prefers-color-scheme:dark)').addEventListener('change',theme);theme();render();
</script></body></html>
